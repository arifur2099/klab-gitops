apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: homelab-root
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/arifur2099/klab-gitops.git
    targetRevision: main
    path: clusters/homelab/applications

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
