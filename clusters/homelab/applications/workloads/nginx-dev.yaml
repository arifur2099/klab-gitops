apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: nginx-dev
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/arifur2099/klab-gitops.git
    targetRevision: main
    path: apps/web-app/overlays/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: web-app

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
